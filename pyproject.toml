[project]
name = "42-call-me-maybe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JARD Noan", email = "noan.pujol@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
    "llm-sdk",
    "flake8>=7.4.1",
    "pytest>=9.1.1",
    "mypy>=2.3.1",
]

[project.scripts]
42-call-me-maybe = "src.__main__:main"

[tool.uv.sources]
llm-sdk = { workspace = true }

[tool.uv.workspace]
members = ["src/llm_sdk"]

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
